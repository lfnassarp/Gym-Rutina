/* Layout: phone app shell — one scrolling column per screen, sticky screen header, rest timer docked above a fixed four-tab bar.
   Single dark theme by design (Performance Lab identity). */
:root{
  --obsidian:#111318;
  --graphite:#1D2129;
  --elevated:#272D38;
  --border:#353C49;
  --blue:#5B8CFF;
  --ice:#A9C3FF;
  --chalk:#F1F3F7;
  --steel:#929BAA;
  --success:#75C9A2;
  --warning:#E9B567;
  --error:#F08080;
  --blue-soft:rgba(91,140,255,.14);
  --success-soft:rgba(117,201,162,.14);
  --scrim:rgba(8,9,12,.72);
  --f-title:"Space Grotesk Variable","Space Grotesk",system-ui,sans-serif;
  --f-ui:"Inter Variable","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-s:6px;--r-c:10px;--r-card:14px;
  --tab-h:62px;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--obsidian)}
body{
  height:100%;margin:0;overflow:hidden;display:flex;flex-direction:column;
  background:var(--obsidian);color:var(--chalk);
  font:400 15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:env(safe-area-inset-bottom,0px);background:var(--graphite);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ice)}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--steel)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#main{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.scr{
  max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:24px;
  padding-left:max(20px,env(safe-area-inset-left,0px));
  padding-right:max(20px,env(safe-area-inset-right,0px));
  padding-block:0 32px;
}
.hdr{
  position:sticky;top:0;z-index:5;background:var(--obsidian);
  display:flex;align-items:center;gap:12px;min-height:64px;padding-block:12px 8px;
  margin-inline:calc(-1 * max(20px,env(safe-area-inset-left,0px))) calc(-1 * max(20px,env(safe-area-inset-right,0px)));
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
}
.hdr.line{border-bottom:1px solid var(--border)}
.hdr-t{flex:1;min-width:0}
.hdr h1{margin:0;font:600 28px/1.15 var(--f-title);letter-spacing:-.01em;text-wrap:balance}
.hdr h1.sm{font-size:20px}
.hdr .sub{margin:2px 0 0;font-size:13px;color:var(--steel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:center;gap:8px}
.brand .logo{width:30px;height:30px;flex:none}
.brand b{font:600 26px/1 var(--f-title);letter-spacing:-.02em;white-space:nowrap}
.brand .ver{font:400 11px/1 var(--f-num);color:var(--steel)}
.icon-btn{
  appearance:none;border:1px solid var(--border);background:var(--graphite);color:var(--chalk);
  width:44px;height:44px;border-radius:var(--r-c);display:grid;place-items:center;flex:none;
}
.icon-btn.plain{border-color:transparent;background:transparent}
.icon-btn:active{background:var(--elevated)}
.icon-btn[disabled]{opacity:.28;pointer-events:none}

.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{margin:0;font:600 18px/1.2 var(--f-title)}
.lbl{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--steel)}
.link{appearance:none;border:0;background:none;padding:6px 0;color:var(--ice);font-weight:500;font-size:14px}

.card{background:var(--graphite);border:1px solid var(--border);border-radius:var(--r-card);padding:16px}
.card.flat{border-color:transparent}
.list{display:flex;flex-direction:column;background:var(--graphite);border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden}
.row{
  appearance:none;border:0;background:none;width:100%;text-align:left;
  display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:56px;color:var(--chalk);
}
.row+.row{border-top:1px solid var(--border)}
.row:active{background:var(--elevated)}
.row-t{flex:1;min-width:0}
.row-t b{display:block;font-weight:500;font-size:15px}
.row-t span{display:block;font-size:13px;color:var(--steel);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ico.chev{width:18px;height:18px;color:var(--steel)}
.tag{
  flex:none;font:500 12px/1 var(--f-num);padding:6px 8px;border-radius:var(--r-s);
  background:var(--elevated);color:var(--chalk);
}
.tag.blue{background:var(--blue-soft);color:var(--ice)}
.tag.act{background:transparent;color:var(--ice);box-shadow:inset 0 0 0 1px rgba(169,195,255,.45)}

.btn{
  appearance:none;border:1px solid transparent;border-radius:var(--r-c);min-height:50px;padding:0 18px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font:600 15px/1 var(--f-ui);background:var(--elevated);color:var(--chalk);border-color:var(--border);
}
.btn.primary{background:var(--blue);color:var(--obsidian);border-color:var(--blue)}
.btn.danger{background:transparent;color:var(--error);border-color:rgba(240,128,128,.4)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ice)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn:active{filter:brightness(.92);transform:translateY(1px)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn:focus-visible,.icon-btn:focus-visible,.row:focus-visible,.tab:focus-visible,.link:focus-visible,.stp button:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.btns{display:flex;gap:10px}
.btns>.btn{flex:1}

.badge{
  display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--f-ui);padding:6px 9px;border-radius:var(--r-s);
  background:var(--elevated);color:var(--chalk);
}
.badge .ico{width:14px;height:14px;stroke-width:2.2}
.badge.up{background:var(--blue);color:var(--obsidian)}
.badge.near{background:transparent;color:var(--ice);box-shadow:inset 0 0 0 1px rgba(169,195,255,.45)}
.badge.pr{background:var(--blue-soft);color:var(--ice)}
.badge.ok{background:var(--success-soft);color:var(--success)}
.badges{display:flex;flex-wrap:wrap;gap:6px}

.bar{height:5px;border-radius:3px;background:var(--border);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:3px}

/* Home */
.next .lbl{display:block}
.next h2{margin:6px 0 2px;font:600 30px/1.1 var(--f-title);letter-spacing:-.01em}
.next p{margin:0 0 16px;color:var(--steel)}
.next .meta{display:flex;gap:16px;margin-bottom:16px;color:var(--steel);font-size:13px}
.next .meta b{color:var(--chalk);font-family:var(--f-num);font-weight:500}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--steel)}
.wd i{
  width:100%;max-width:40px;aspect-ratio:1;border-radius:var(--r-c);background:var(--elevated);
  display:grid;place-items:center;font:500 12px/1 var(--f-num);font-style:normal;color:var(--steel);
}
.wd.on i{background:var(--blue);color:var(--obsidian)}
.wd.act i{background:transparent;color:var(--ice);box-shadow:inset 0 0 0 1.5px rgba(169,195,255,.6)}
.wd.both i{position:relative}
.wd.both i::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--ice)}
.wd.today{color:var(--chalk);font-weight:600}
.wd.today i{outline:1.5px solid var(--chalk);outline-offset:2px}
.wk-legend{margin:12px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:12px;color:var(--steel)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--blue)}
.sw.act{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(169,195,255,.7)}
.wk-legend>span{display:inline-flex;align-items:center;gap:6px;margin-right:8px}
.wk-sum{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.wk-sum .num{font-size:15px}

/* Workout */
.ses-h{flex-wrap:wrap;row-gap:10px}
.ses-h .elapsed{font:500 15px/1 var(--f-num);color:var(--steel)}
.ses-prog{flex-basis:100%;display:flex;align-items:center;gap:10px}
.ses-prog .bar{flex:1}
.ses-prog .num{font-size:12px;color:var(--steel)}
.exs{display:flex;flex-direction:column;gap:10px}
.ex{background:var(--graphite);border:1px solid var(--border);border-radius:var(--r-card)}

      <div class="stat"><span class="lbl">1RM estimado</span><b>${disp(r.e1)}</b><small>${UNIT_LABEL[u]}</small></div>
      <div class="stat"><span class="lbl">Sesiones</span><b>${r.sessions}</b><small>registradas</small></div></div>`;
  }
  const pts = h0.slice().reverse().map(({ s, e }) => {
    const ws = workSets(e);
    if (u === 'corporal') return { t: s.start, y: Math.max(...ws.map(x => x.r)) };
    const best = Math.max(...ws.map(x => e1rm(normW(x), x.r)));
    return { t: s.start, y: u === 'nivel' ? best : fromKg(best, u) };
  }).slice(-24);
  h += `<section class="sec"><div class="sec-h"><h2>Evolución</h2><span class="lbl">${u === 'corporal' ? 'mejor serie · reps' : '1RM estimado · ' + UNIT_LABEL[u]}</span></div><div class="card">${lineChart(pts, u)}</div></section>`;
  h += `<section class="sec"><div class="sec-h"><h2>Historial</h2></div><div class="card">` + h0.slice(0, 30).map(({ s, e }) =>
    `<div class="hist-ex"><b>${esc(fmtDate(s.start))}</b><span class="num">${e.sets.map(x => (x.drop ? 'drop ' : '') + fmtSet(x)).join(' · ')}</span></div>`).join('') + `</div></section>`;
  return `<div class="scr">${h}</div>`;
}

/* ---- History ---- */
function vHistory() {
  const t = top();
  if (t && t.v === 'session') return vSessionDetail(t.id);
  if (t && t.v === 'ex') return vExercise(t.id);
  const now = new Date();
  const m = ui.calMonth || new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  ui.calMonth = m;
  const md = new Date(m), y = md.getFullYear(), mo = md.getMonth();
  const first = weekStart(m), nextM = new Date(y, mo + 1, 1).getTime();
  const goal = db.settings.goal || 4;
  const byDay = {}, actByDay = {};
  for (const s of db.sessions) (byDay[dayKey(s.start)] = byDay[dayKey(s.start)] || []).push(s);
  for (const a of db.activities) (actByDay[dayKey(a.date)] = actByDay[dayKey(a.date)] || []).push(a);
  let h = header('Historial', { right: `<button class="icon-btn" data-act="new-act" aria-label="Registrar otra actividad">${ico('plus')}</button>` });
  h += `<section class="sec"><div class="cal-nav"><button class="icon-btn plain" data-act="cal-prev" aria-label="Mes anterior">${ico('back')}</button><h2>${MONTHS[mo]} ${y}</h2><button class="icon-btn plain" data-act="cal-next" aria-label="Mes siguiente">${ico('chev')}</button></div>
    <div class="card"><div class="cal">${DOW1.map(d => `<span class="dh">${d}</span>`).join('')}<span class="dh">Sem</span>`;
  let weeksMet = 0, weeksCounted = 0, monthCount = 0, monthActs = 0;
  const todayK = dayKey(Date.now());
  for (let ws = first; ws < nextM; ws = addDays(ws, 7)) {
    let wcount = 0;
    for (let i = 0; i < 7; i++) {
      const t2 = addDays(ws, i), k = dayKey(t2), d = new Date(t2);
      const list = byDay[k] || [], acts = actByDay[k] || [];
      wcount += list.length;
      if (d.getMonth() === mo) { monthCount += list.length; monthActs += acts.length; }
      const cls = ['cd'];
      if (d.getMonth() !== mo) cls.push('out');
      if (t2 > Date.now()) cls.push('fut');
      if (list.length) cls.push('on'); else if (acts.length) cls.push('act');
      if (k === todayK) cls.push('today');
      if (ui.calSel === k) cls.push('sel');
      let lab = '';
      if (list.length) lab = list.length > 1 ? list.length + '×' : shortName(routineById(list[0].rid) || { name: list[0].rname });
      else if (acts.length) lab = acts.length > 1 ? acts.length + '×' : actType(acts[0]).code;
      const n = list.length + acts.length;
      const desc = [list.length ? list.length + ' de gimnasio' : '', acts.length ? acts.length + ' otra' + (acts.length > 1 ? 's' : '') : ''].filter(Boolean).join(', ');
      h += `<button class="${cls.join(' ')}" data-act="cal-day" data-k="${k}" ${n ? '' : 'tabindex="-1"'} aria-label="${d.getDate()} ${MONTHS[d.getMonth()]}${desc ? ': ' + desc : ''}">${d.getDate()}${lab ? `<small>${esc(lab)}</small>` : ''}${list.length && acts.length ? '<i class="dot"></i>' : ''}</button>`;
    }
    const started = ws <= Date.now();
    if (started) { weeksCounted++; if (wcount >= goal) weeksMet++; }
    h += `<span class="wk${wcount >= goal ? ' met' : ''}">${started ? wcount + '/' + goal : ''}</span>`;
  }
  h += `</div><p class="wk-legend"><span><i class="sw on"></i>Gimnasio</span><span><i class="sw act"></i>Otra actividad</span><span>Sem: sesiones de gimnasio por semana</span></p></div>`;
  const pct = weeksCounted ? Math.round(weeksMet / weeksCounted * 100) : 0;
  h += `<div class="stats"><div class="stat"><span class="lbl">Gimnasio</span><b>${monthCount}</b><small>sesiones este mes</small></div>
    <div class="stat"><span class="lbl">Otras</span><b>${monthActs}</b><small>actividades</small></div>
    <div class="stat"><span class="lbl">Cumplimiento</span><b>${pct}%</b><small>${weeksMet}/${weeksCounted} semanas con ${goal}</small></div></div></section>`;
  const inRange = ts => ui.calSel ? dayKey(ts) === ui.calSel : (ts >= m && ts < nextM);
  const items = db.sessions.filter(s => inRange(s.start)).map(s => ({ t: s.start, html: sessionRow(s) }))
    .concat(db.activities.filter(a => inRange(a.date)).map(a => ({ t: a.date, html: actRow(a) })))
    .sort((p, q) => q.t - p.t);
  h += `<section class="sec"><div class="sec-h"><h2>${ui.calSel ? esc(fmtDate(new Date(ui.calSel + 'T12:00').getTime())) : 'Registros del mes'}</h2>${ui.calSel ? `<button class="link" data-act="cal-clear">Ver todo el mes</button>` : ''}</div>`;
  h += items.length ? `<div class="list">${items.map(i => i.html).join('')}</div>` : `<div class="empty"><b>Sin registros</b>${ui.calSel ? 'Ese día no registraste entreno.' : 'Los días que entrenes quedarán marcados en el calendario.'}</div>`;
  h += `</section>`;
  return `<div class="scr">${h}</div>`;
}

let restEnded = false, restHideAt = 0;
function renderRest() {
  const el = $('#rest'), a = db.active;
  if (!a || !a.restEnd) { el.hidden = true; el.classList.remove('end'); return; }
  const left = a.restEnd - Date.now();
  if (left <= 0 && !restEnded) { restEnded = true; restHideAt = Date.now() + 5000; restAlarm(); }
  if (restEnded && Date.now() > restHideAt) { a.restEnd = null; restEnded = false; el.hidden = true; el.classList.remove('end'); return; }
  el.hidden = false;
  el.classList.toggle('end', left <= 0);
  const pct = Math.max(0, Math.min(100, (1 - left / a.restTotal) * 100));
  const html = `<div class="rest-in"><div class="rest-t"><div class="top"><span class="lbl">${left > 0 ? 'Descanso' : 'Descanso terminado'}</span><span class="clock num">${fmtClock(left)}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>
    ${left > 0 ? `<button class="btn" data-act="rest-minus" aria-label="Quitar 15 segundos">−15</button><button class="btn" data-act="rest-plus" aria-label="Agregar 15 segundos">+15</button>` : ''}<button class="btn" data-act="rest-skip">${left > 0 ? 'Saltar' : 'Cerrar'}</button></div>`;
  if (el.dataset.k !== String(Math.ceil(left / 1000)) + (left > 0)) { el.innerHTML = html; el.dataset.k = String(Math.ceil(left / 1000)) + (left > 0); }
  else { const c = el.querySelector('.clock'); if (c) c.textContent = fmtClock(left); const i = el.querySelector('.bar i'); if (i) i.style.width = pct + '%'; }
}
function tick() {
  const a = db.active;

  renderRest();
}
setInterval(tick, 250);

/* ================= Sound, wake lock, toast ================= */
let ac = null;
function audio() { try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) { ac = null; } return ac; }
function beep(f, t0, dur, vol) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + t0, o = a.createOscillator(), g = a.createGain();
  o.type = 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
function sound() { beep(1320, 0, 0.08, 0.08); }
function restAlarm() { beep(880, 0, 0.18); beep(880, 0.28, 0.18); beep(1320, 0.56, 0.3); try { navigator.vibrate && navigator.vibrate([150, 100, 150]); } catch (e) {} }
let wl = null;
async function wake(on) {
  try {
    if (on) { if (!wl && navigator.wakeLock) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } }
    else if (wl) { const w = wl; wl = null; await w.release(); }
  } catch (e) { wl = null; }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && db.active) wake(true); if (document.hidden) save(true); });
let toastT = null;
function toast(html, kind, ms) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast' + (kind ? ' ' + kind : ''); t.setAttribute('role', 'status'); t.innerHTML = html;
  document.body.appendChild(t);
  $('#live').textContent = t.textContent;
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), ms || 2200);
}
function shake(sel) { const el = $(sel); if (el) { el.focus(); el.closest('.stp') && el.closest('.stp').animate && el.closest('.stp').animate([{ transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'none' }], { duration: 220, iterations: 2 }); } }

function actSheet(id) {

    <div class="grid2"><label class="field"><span>Fecha</span><input class="inp" type="date" id="a-date" value="${dateKey}" max="${dayKey(Date.now())}"></label>
      <div class="field"><span>Duración · min</span><div class="mini-stp"><button type="button" data-d="-5" aria-label="Menos 5 minutos">${ico('minus')}</button><input class="num" id="a-dur" inputmode="numeric" value="${st.dur == null ? '' : st.dur}" aria-label="Minutos"><button type="button" data-d="5" aria-label="Más 5 minutos">${ico('plus')}</button></div></div></div>
    ${t.dist ? `<label class="field"><span>Distancia · ${t.dist} (opcional)</span><input class="inp num" id="a-dist" inputmode="decimal" value="${st.dist == null ? '' : String(st.dist).replace('.', ',')}" placeholder="${t.dist === 'km' ? 'Ej. 5,2' : 'Ej. 1500'}"></label>` : ''}
    <div class="field"><span>Intensidad</span><div class="seg" role="group" aria-label="Intensidad">${INTENS.map(i => `<button type="button" data-int="${i}" aria-pressed="${st.intensity === i}">${i}</button>`).join('')}</div></div>
    <label class="field"><span>Nota</span><textarea class="inp" id="a-note" placeholder="Opcional: ruta, cómo te sentiste…" style="min-height:72px">${esc(st.note || '')}</textarea></label>
    <div class="btns"><button class="btn" data-sheet="cancel">Cancelar</button><button class="btn primary" data-sheet="ok">Guardar</button></div>
    ${orig ? `<button class="btn danger block" data-sheet="del">${ico('trash')}Eliminar actividad</button>` : ''}`;
  };
  const wire = s => {
    const c = s.querySelector('.sheet-c');
    c.innerHTML = body();
    c.querySelectorAll('[data-type]').forEach(b => b.onclick = () => { capture(s); st.type = b.dataset.type; wire(s); });
    c.querySelectorAll('[data-int]').forEach(b => b.onclick = () => { capture(s); st.intensity = st.intensity === b.dataset.int ? null : b.dataset.int; wire(s); });
    c.querySelectorAll('.mini-stp button').forEach(b => b.onclick = () => { const i = c.querySelector('#a-dur'); i.value = Math.max(0, (parseN(i.value) || 0) + +b.dataset.d); });
    c.querySelector('[data-sheet="cancel"]').onclick = closeSheet;
    c.querySelector('[data-sheet="ok"]').onclick = () => {
      capture(s);
      if (!st.dur || st.dur <= 0) { toast('Escribe cuántos minutos duró', 'err'); c.querySelector('#a-dur').focus(); return; }
      if (st.type === 'otro' && !(st.name || '').trim()) { toast('Escribe qué actividad hiciste', 'err'); c.querySelector('#a-name').focus(); return; }
      let date = st.date;
      if (!orig || dateKey !== dayKey(orig.date)) {
        const [yy, mm, dd] = dateKey.split('-').map(Number);
        date = dateKey === dayKey(Date.now()) ? Date.now() : new Date(yy, mm - 1, dd, 12).getTime();
      }
      const rec = { id: orig ? orig.id : uid(), type: st.type, name: st.type === 'otro' ? st.name.trim() : '', date, dur: Math.round(st.dur), dist: ACTS[st.type].dist && st.dist ? st.dist : null, intensity: st.intensity || null, note: (st.note || '').trim() };
      if (orig) db.activities[db.activities.indexOf(orig)] = rec; else db.activities.push(rec);
      db.activities.sort((p, q) => p.date - q.date);

  sheet('', wire);

/* ================= Backup ================= */
async function exportData() {
  const stamp = new Date();
  db.settings.lastBackup = stamp.getTime();
  const payload = JSON.stringify({ app: 'gym-rutina', version: VERSION, exported: stamp.toISOString(), data: db }, null, 1);
  const name = `gym-rutina-respaldo-${dayKey(stamp.getTime())}.json`;
  const file = new File([payload], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Respaldo de ' + APP_NAME }); save(true); render(); toast('Copia lista'); return; }
  } catch (e) { if (e && e.name === 'AbortError') { db.settings.lastBackup = null; return; } }
  const url = URL.createObjectURL(file);
  const link = document.createElement('a'); link.href = url; link.download = name; document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  save(true); render(); toast('Copia descargada');
}
$('#file-in').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    let obj = null;
    try { obj = JSON.parse(rd.result); } catch (err) { obj = null; }
    if (!obj || !['gym-rutina', 'carga'].includes(obj.app) || !obj.data || obj.data.v !== 1 || !Array.isArray(obj.data.sessions)) { toast('Ese archivo no es una copia de ' + APP_NAME, 'err', 3000); return; }
    const n = obj.data.sessions.length;
    confirmSheet('¿Reemplazar tus datos?', `La copia es del ${fmtDate(Date.parse(obj.exported) || Date.now())} y tiene ${n} sesiones, ${(obj.data.activities || []).length} actividades y ${obj.data.routines.length} días de rutina. Lo que tienes ahora en este celular se reemplaza.`, 'Reemplazar', () => {
      db = obj.data; if (!Array.isArray(db.activities)) db.activities = []; db.sessions.sort((a, b) => a.start - b.start); save(true);
      ui.stack = { home: [], train: [], progress: [], history: [] }; ui.tab = 'home'; render(true); toast('Datos importados');
    }, true);
  };
  rd.readAsText(f);
});

document.addEventListener('click', e => {
  const tabBtn = e.target.closest('.tab');
  if (tabBtn) {
    const tname = tabBtn.dataset.tab;
    if (ui.tab === tname) ui.stack[tname] = []; else ui.tab = tname;
    if (tname === 'history') ui.calSel = null;
    render(true); return;
  }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, a = db.active;
  if (a && ['w-', 'w+', 'r-', 'r+', 'unit', 'add-set', 'skip-drop', 'open-entry', 'edit-set', 'finish', 'add-ex', 'cancel-edit'].includes(act)) draftFromInputs();
  switch (act) {
    case 'back': back(); break;
    case 'open-plan': push({ v: 'plan' }); break;
    case 'go-train': ui.tab = 'train'; ui.stack.train = []; render(true); break;
    case 'go-session': ui.stack.train = []; render(true); break;
    case 'start':
      if (db.active) { confirmSheet('Ya hay una sesión en curso', `Tienes ${db.active.rname} sin terminar. ¿Quieres descartarla y empezar otra?`, 'Descartar y empezar', () => { db.active = null; startSession(id); }, true); }
      else startSession(id);
      break;
    case 'open-routine': push({ v: 'routine', id }); break;
    case 'open-ex': push({ v: 'ex', id }); break;
    case 'open-session': push({ v: 'session', id }); break;
    case 'summary-done': ui.stack.train = []; ui.tab = 'home'; render(true); break;
    case 'open-entry': { const i = +el.dataset.i; a.open = a.open === i ? -1 : i; save(); render(); if (a.open === i) ui.scrollTo = null; break; }
    case 'w-': case 'w+': {
      const en = a.entries[a.open], st = en.sets[curIndex(en)], inp = $('#in-w');
      const step = STEP[st.u] || 1, base = parseN(inp.value);
      const v = Math.max(0, Math.round(((base == null ? 0 : base) + (act === 'w+' ? step : -step)) * 100) / 100);
      inp.value = String(v).replace('.', ','); break;
    }
    case 'r-': case 'r+': {
      const en = a.entries[a.open], si = curIndex(en), inp = $('#in-r');
      const base = parseN(inp.value) != null ? parseN(inp.value) : (placeholderReps(en, si) != null ? placeholderReps(en, si) : (act === 'r+' ? en.min - 1 : en.min + 1));
      inp.value = Math.max(0, Math.round(base) + (act === 'r+' ? 1 : -1)); break;
    }
    case 'unit': {
      const en = a.entries[a.open], ex = exOf(en.ex);
      const cur = en.sets[curIndex(en)].u;
      const nu = cur === 'kg' ? 'lb' : cur === 'lb' ? 'kg' : cur;
      if (nu === cur) { toast('Cambia esta unidad desde Plan › Ejercicios'); break; }
      en.sets.forEach(s => { if (!s.done) s.u = nu; });
      if (db.exercises[en.ex]) ex.unit = nu;
      save(); render(); toast(`Unidad de ${ex.name}: ${nu}`); break;
    }
    case 'register': registerSet(); break;
    case 'edit-set': { const en = a.entries[a.open]; en.editing = +el.dataset.si; render(); break; }
    case 'cancel-edit': { const en = a.entries[a.open]; en.editing = null; render(); break; }
    case 'add-set': {
      const en = a.entries[a.open], ws = workSets(en), lastS = ws[ws.length - 1];
      const at = en.sets.findIndex(s => s.drop);
      const ns = { w: lastS ? lastS.w : null, pw: lastS ? lastS.w : null, r: null, u: lastS ? lastS.u : exOf(en.ex).unit, done: false, drop: false };
      if (at >= 0) en.sets.splice(at, 0, ns); else en.sets.push(ns);
      save(); render(); break;
    }
    case 'skip-drop': { const en = a.entries[a.open]; en.sets = en.sets.filter(s => !(s.drop && !s.done)); en.skipDrop = true; save(); render(); break; }
    case 'finish': finishSheet(); break;
    case 'add-ex': pickExerciseSheet(exId => {
      const ex = exOf(exId), last = history(exId)[0];
      const prev = last ? workSets(last.e).map(s => ({ w: s.w, r: s.r, u: s.u })) : [];
      const p = prev[0];
      a.entries.push({ id: uid(), ex: exId, min: 8, max: 12, rest: 90, planned: 2, drop: false, note: '', prev, sets: [0, 1].map(k => ({ w: (prev[k] || p) && ex.unit !== 'corporal' ? (prev[k] || p).w : null, r: null, u: ex.unit, done: false, drop: false })), editing: null, skipDrop: false });
      a.open = a.entries.length - 1; ui.scrollTo = a.open; save(); render();
    }, () => { ui.tab = 'home'; ui.stack.home = [{ v: 'plan' }, { v: 'ex-edit', id: null, then: { addToSession: true } }]; ui.exDraft = null; render(true); }); break;
    case 'rest-plus': a.restEnd += 15000; a.restTotal += 15000; renderRest(); break;
    case 'rest-minus': a.restEnd -= 15000; renderRest(); break;
    case 'rest-skip': a.restEnd = null; restEnded = false; renderRest(); break;
    case 'install': installSheet(); break;
    // history
    case 'cal-prev': { const d = new Date(ui.calMonth); ui.calMonth = new Date(d.getFullYear(), d.getMonth() - 1, 1).getTime(); ui.calSel = null; render(); break; }
    case 'cal-next': { const d = new Date(ui.calMonth); ui.calMonth = new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime(); ui.calSel = null; render(); break; }
    case 'cal-day': {
      const k = el.dataset.k, list = db.sessions.filter(s => dayKey(s.start) === k), acts = db.activities.filter(x => dayKey(x.date) === k);
      if (list.length === 1 && !acts.length) push({ v: 'session', id: list[0].id });
      else if (acts.length === 1 && !list.length) actSheet(acts[0].id);
      else if (list.length || acts.length) { ui.calSel = k; render(); }
      break;
    }
    case 'new-act': actSheet(); break;
    case 'open-act': actSheet(id); break;
    case 'cal-clear': ui.calSel = null; render(); break;
    case 'del-session': confirmSheet('¿Eliminar esta sesión?', 'Se borra del historial y de tus récords. No se puede deshacer.', 'Eliminar', () => { db.sessions = db.sessions.filter(s => s.id !== id); save(true); back(); }, true); break;
    // plan
    case 'edit-routine': push({ v: 'routine-edit', id }); break;
    case 'add-routine': {
      const n = db.routines.length + 1;
      const r = { id: uid(), name: 'Día ' + n, title: 'Nuevo día', items: [] };
      db.routines.push(r); save(); push({ v: 'routine-edit', id: r.id }); break;
    }
    case 'r-up': case 'r-down': { const i = +el.dataset.i, j = act === 'r-up' ? i - 1 : i + 1; if (j < 0 || j >= db.routines.length) break; [db.routines[i], db.routines[j]] = [db.routines[j], db.routines[i]]; save(); render(); break; }
    case 'del-routine': confirmSheet('¿Eliminar este día?', 'Se quita de la rutina. Tu historial y los ejercicios se conservan.', 'Eliminar', () => { db.routines = db.routines.filter(r => r.id !== id); save(true); back(); }, true); break;
    case 'it-up': case 'it-down': { const r = routineById(id), i = +el.dataset.i, j = act === 'it-up' ? i - 1 : i + 1; if (j < 0 || j >= r.items.length) break; [r.items[i], r.items[j]] = [r.items[j], r.items[i]]; save(); render(); break; }
    case 'edit-item': itemSheet(id, +el.dataset.i); break;
    case 'pick-ex': pickExerciseSheet(exId => {
      const r = routineById(id); r.items.push({ id: uid(), ex: exId, sets: 2, min: 8, max: 12, rest: 90, note: '', drop: false }); save(); render();
      itemSheet(id, r.items.length - 1);
    }, () => { ui.exDraft = null; push({ v: 'ex-edit', id: null, then: { addTo: id } }); }); break;
    case 'goal-': case 'goal+': db.settings.goal = Math.max(1, Math.min(7, (db.settings.goal || 4) + (act === 'goal+' ? 1 : -1))); save(); render(); break;
    case 'new-ex': ui.exDraft = null; push({ v: 'ex-edit', id: null }); break;
    case 'edit-ex': ui.exDraft = null; if (ui.tab !== 'home') { ui.tab = 'home'; ui.stack.home = [{ v: 'plan' }]; } push({ v: 'ex-edit', id }); break;
    case 'ex-unit': ui.exDraft.unit = el.dataset.u; captureVids(); render(); break;
    case 'ex-vid-add': captureVids(); ui.exDraft.videos.push(''); render(); { const ins = document.querySelectorAll('.ex-vid'); if (ins.length) ins[ins.length - 1].focus(); } break;
    case 'ex-vid-del': captureVids(); ui.exDraft.videos.splice(+el.dataset.k, 1); render(); break;
    case 'ex-save': saveExercise(); break;
    case 'ex-del': confirmSheet('¿Eliminar ejercicio?', 'Su historial queda en las sesiones pasadas.', 'Eliminar', () => { delete db.exercises[id]; save(true); back(); }, true); break;
    case 'edit-note': noteSheet(); break;
    case 'export': exportData(); break;
    case 'import': $('#file-in').click(); break;
  }
});
function captureVids() {
  if (!ui.exDraft) return;
  document.querySelectorAll('.ex-vid').forEach(i => { ui.exDraft.videos[+i.dataset.k] = i.value.trim(); });
  const n = $('#ex-name'), g = $('#ex-group'), t = $('#ex-note');
  ui.exDraft.name = n ? n.value : ui.exDraft.name; ui.exDraft.group = g ? g.value : ui.exDraft.group; ui.exDraft.note = t ? t.value : ui.exDraft.note;
}
function saveExercise() {
  captureVids();
  const d = ui.exDraft, name = ($('#ex-name').value || '').trim();
  if (!name) { toast('Ponle un nombre al ejercicio', 'err'); $('#ex-name').focus(); return; }
  const videos = d.videos.map(v => v.trim()).filter(Boolean).map(v => /^https?:\/\//i.test(v) ? v : 'https://' + v);
  let id = d.id;
  if (!id) {
    id = name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'ejercicio';
    while (db.exercises[id]) id += '-' + Math.random().toString(36).slice(2, 4);
  }
  db.exercises[id] = { id, name, group: $('#ex-group').value, unit: d.unit, videos, note: $('#ex-note').value.trim() };
  const then = d.then || {};
  ui.exDraft = null;
  if (then.addTo) { const r = routineById(then.addTo); if (r) r.items.push({ id: uid(), ex: id, sets: 2, min: 8, max: 12, rest: 90, note: '', drop: false }); }
  if (then.addToSession && db.active) {
    const ex = db.exercises[id];
    db.active.entries.push({ id: uid(), ex: id, min: 8, max: 12, rest: 90, planned: 2, drop: false, note: '', prev: [], sets: [0, 1].map(() => ({ w: null, r: null, u: ex.unit, done: false, drop: false })), editing: null, skipDrop: false });
    db.active.open = db.active.entries.length - 1;
    save(true); ui.stack.home = []; ui.tab = 'train'; ui.stack.train = []; render(true); toast('Ejercicio agregado a la sesión'); return;
  }
  save(true); back(); toast('Ejercicio guardado');
}
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]'); if (!el) return;
  const r = routineById(el.dataset.id); if (!r) return;
  if (el.dataset.change === 'r-name') r.name = el.value.trim() || r.name;
  if (el.dataset.change === 'r-title') r.title = el.value.trim();
  save();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id === 'in-w' || e.target.id === 'in-r')) { e.preventDefault(); if (e.target.id === 'in-w') { const r = $('#in-r'); if (r) r.focus(); } else registerSet(); }
  if (e.key === 'Escape') closeSheet();

window.__gym = { get db() { return db; }, set db(v) { db = v; }, ui, render, progress, records, history, nextRoutineIndex, startSession, finishSession, registerSet, seed, save };
